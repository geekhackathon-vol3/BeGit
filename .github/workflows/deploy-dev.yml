name: Deploy (dev)

# PoC 期間は begit-dev を運用環境とする（TestFlight と GitHub App の接続先）。
# main へのマージで自動デプロイする。ブランチを試すときは "Run workflow" から ref を選ぶ。
on:
  push:
    branches: [main]
    # バックエンドに関係しないマージ（iOS・ドキュメント）ではコンテナを入れ替えない。
    paths:
      - "backend/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

# マージが続いてもデプロイを並行させない。
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy to begit-dev
    runs-on: ubuntu-latest
    # 固まったときに concurrency のロックを持ち続けないようにする。
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # Cloudflare のトークンは wrangler のステップにだけ渡す。go test・npm ci で動く
    # 依存パッケージのコードから読めないようにするため。
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # 必須チェックは admin が迂回でき、手動実行ではブランチを直接出せるため、ここでもテストする。
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # 新しいコードより先にスキーマを更新する。マイグレーションは旧コードでも動く追加のみにすること。
      - name: Apply D1 migrations (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply begit-db-dev --env dev --remote
      - name: Deploy Workers (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env dev
      - name: Seed dev data (best-effort)
        # コールドスタート直後は失敗しうるため、失敗してもワークフローは成功扱いにする。
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          # コンテナ起動待ち（最大 ~60s）
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$DEV_URL/healthz" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          DEV_URL="$DEV_URL" ./scripts/seed-dev.sh
        env:
          DEV_URL: https://begit-dev.118029-ichikama.workers.dev

name: Deploy

# PoC 期間は利用者が begit-dev のみのため、本番（begit）は手動デプロイにする。
# App Store 公開で本番へ切り替えるときに自動デプロイを戻す。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # 新しいコードより先にスキーマを更新する。マイグレーションは旧コードでも動く追加のみにすること。
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply begit-db --remote
      - name: Deploy Workers
        run: npx wrangler deploy

name: Deploy

# PoC 期間は利用者が begit-dev のみのため、本番（begit）は手動デプロイにする。
# App Store 公開で本番へ切り替えるときに自動デプロイを戻す。
on:
  workflow_dispatch:

# 手動実行を続けて起動しても、マイグレーションとデプロイを一組ずつ順に実行する。
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # Cloudflare のトークンは wrangler のステップにだけ渡す（npm ci で動くコードから読めないようにする）。
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # 新しいコードより先にスキーマを更新する。マイグレーションは旧コードでも動く追加のみにすること。
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply begit-db --remote
      - name: Deploy Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
